      <stop offset="0" stop-color="#ff2a6d"/>
      <stop offset="1" stop-color="#9a00e6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0c10"/>
  <polygon points="7,53 19,53 22.2,37 10.2,37" fill="#8a96b0"/>
  <polygon points="23,53 35,53 40.2,27 28.2,27" fill="#f0f4fc"/>
  <polygon points="39,53 51,53 58,18 46,18" fill="url(#accent)"/>
</svg>
